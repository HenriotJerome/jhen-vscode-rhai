name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - name: Check the Open VSX token
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::The OVSX_PAT secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "OVSX_PAT is configured."

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --skip-duplicate *.vsix

      - name: Attach the VSIX to the release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.vsix'
          generate_release_notes: true

      - name: Verify Open VSX
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          PUBLISHER=$(node -p "require('./package.json').publisher")
          URL="https://open-vsx.org/api/${PUBLISHER}/${NAME}/${VERSION}"
          for attempt in 1 2 3 4 5 6; do
            if curl -sf "$URL" > /dev/null; then
              echo "Open VSX serves ${VERSION}."
              exit 0
            fi
            echo "Not available yet (attempt ${attempt}), waiting..."
            sleep 30
          done
          echo "::error::Open VSX does not serve ${VERSION} after the publish."
          exit 1
